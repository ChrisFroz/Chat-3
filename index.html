<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat del curso</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 0 12px; }
    #mensajes { border: 1px solid #ccc; border-radius: 8px; height: 400px; overflow-y: auto; padding: 10px; }
    .hora { color: #888; font-size: 12px; }
    form { display: flex; gap: 6px; margin-top: 8px; }
    #texto { flex: 1; padding: 10px; }
  </style>
</head>
<body>
  <h1>Chat del curso</h1>
  <div id="mensajes"></div>
  <form id="formulario">
    <input id="texto" placeholder="Escribe un mensaje..." autocomplete="off">
    <button>Enviar</button>
  </form>

  <script>
    const URL_SUPABASE = "https://tojilmdcubopzsbrsmtb.supabase.co";
    const KEY = "sb_publishable_tO8YBGhdjtx1JXw8JtkQew_ywX5VHAc";
    const db = supabase.createClient(URL_SUPABASE, KEY);

    const nombre = prompt("Tu nombre:") || "Anónimo";
    const caja = document.getElementById("mensajes");
    let ultimoId = 0;

    function mostrar(m) {
      const hora = new Date(m.created_at).toLocaleTimeString("es-CL", { hour: "2-digit", minute: "2-digit" });
      const linea = document.createElement("div");
      linea.innerHTML = `<span class="hora">[${hora}]</span> <b></b>: <span></span>`;
      linea.querySelector("b").textContent = m.autor;
      linea.querySelectorAll("span")[1].textContent = m.texto;
      caja.appendChild(linea);
      caja.scrollTop = caja.scrollHeight;
      ultimoId = m.id;
    }

    async function cargarHistorial() {
      const { data } = await db.from("mensajes").select("*").order("id", { ascending: false }).limit(20);
      data.reverse().forEach(mostrar);
    }

    async function revisarNuevos() {
      const { data } = await db.from("mensajes").select("*").gt("id", ultimoId).order("id");
      if (data) data.forEach(mostrar);
    }

    document.getElementById("formulario").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = document.getElementById("texto");
      const texto = input.value.trim();
      if (!texto) return;
      input.value = "";
      await db.from("mensajes").insert({ autor: nombre, texto: texto.slice(0, 500) });
    });

    cargarHistorial().then(() => setInterval(revisarNuevos, 2000));
  </script>
</body>
</html>
